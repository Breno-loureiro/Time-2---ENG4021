{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minha conta | CAMISA 12</title>

</head>


<body>

    <h1>Minha conta</h1>


    {% for message in messages %}

        <p>
            {{ message }}
        </p>

    {% endfor %}


    <h2>
        Olá, {{ usuario.username }}!
    </h2>


    <p>
        <strong>E-mail:</strong>
        {{ usuario.email }}
    </p>


    <p>
        <strong>Usuário:</strong>
        {{ usuario.username }}
    </p>


    <hr>


    <form
        method="POST"
        action="{% url 'Camisa12:logout' %}"
    >

        {% csrf_token %}

        <button type="submit">
            Sair
        </button>

    </form>

</body>

</html>
