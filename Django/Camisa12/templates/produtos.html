<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produtos | CAMISA 12</title>

</head>


<body>

<h1>CAMISA 12</h1>

<h2>Produtos</h2>


<form method="GET">

    <input
        type="text"
        name="busca"
        placeholder="Buscar produto..."
        value="{{ busca }}"
    >


    <select name="categoria">

        <option value="">
            Todas as categorias
        </option>


        {% for valor, nome in categorias %}

            <option
                value="{{ valor }}"
                {% if categoria == valor %}
                    selected
                {% endif %}
            >

                {{ nome }}

            </option>

        {% endfor %}

    </select>


    <button type="submit">
        Buscar
    </button>

</form>


<hr>


{% for produto in produtos %}

    <article>

        {% if produto.imagem %}

            <img
                src="{{ produto.imagem }}"
                alt="{{ produto.nome }}"
                width="200"
            >

        {% endif %}


        <h3>

            <a
                href="{% url 'Camisa12:produto_detalhe' produto.id %}"
            >

                {{ produto.nome }}

            </a>

        </h3>


        <p>
            {{ produto.get_categoria_display }}
        </p>


        {% if produto.time %}

            <p>
                Time:
                {{ produto.time.nome }}
            </p>

        {% endif %}


        <p>

            <strong>
                R$ {{ produto.preco }}
            </strong>

        </p>

    </article>


    <hr>


{% empty %}

    <p>
        Nenhum produto encontrado.
    </p>

{% endfor %}


</body>

</html>
