<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CAMISA 12</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
        }

        header {
            background-color: black;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 420px;
            margin: 60px auto;
            background-color: #1d1d1d;
            padding: 30px;
            border-radius: 12px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #555;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background-color: #2ecc71;
            font-weight: bold;
            cursor: pointer;
        }

        .mensagem {
            padding: 10px;
            background-color: #333;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .cadastro {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2ecc71;
        }

    </style>

</head>


<body>

<header>

    <h1>CAMISA 12</h1>

</header>


<div class="container">

    <h2>Entrar</h2>


    {% for message in messages %}

        <div class="mensagem">
            {{ message }}
        </div>

    {% endfor %}


    <form method="POST">

        {% csrf_token %}


        <label for="username">
            Nome de usuário
        </label>

        <input
            type="text"
            id="username"
            name="username"
            required
        >


        <label for="password">
            Senha
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >


        <button type="submit">
            Entrar
        </button>

    </form>


    <div class="cadastro">

        Ainda não possui uma conta?

        <a href="{% url 'Camisa12:cadastro' %}">
            Criar conta
        </a>

    </div>

</div>

</body>

</html>
