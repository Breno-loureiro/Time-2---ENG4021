<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | CAMISA 12</title>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS - LOGIN USUARIO.css">
</head>
<body>

    <main>
        <section id="login">
            <a class="marca" href="../Tela Figma/HTML - FIGMA.html">
                <img src="img/icone-camisa.svg" alt="Ícone de camisa do CAMISA 12">
                <span class="marca-nome">CAMISA 12</span>
            </a>

            <h1>ENTRAR</h1>
            <p>Use seu nome de usuário e sua senha.</p>

            <form action="#" method="post">
                <label for="username">Nome de usuário</label>
                <input type="text" id="username" name="username" placeholder="ex.: torcedor12" required>

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Sua senha" required>

                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>

</body>
</html>
